# Configuration file

roll_six {
    # List of potion effects granted on a roll of 6.
    # Format per entry: "registryName,amplifier,durationSeconds"
    # 
    #   registryName    : the potion's registry name, e.g. "minecraft:strength"
    #   amplifier       : effect level minus 1 (0 = Level I, 1 = Level II, 4 = Level V)
    #   durationSeconds : duration in seconds (e.g. 30 = 30 seconds)
    # 
    # Vanilla potion registry names:
    #   minecraft:strength        minecraft:weakness
    #   minecraft:resistance      minecraft:poison
    #   minecraft:speed           minecraft:slowness
    #   minecraft:haste           minecraft:mining_fatigue
    #   minecraft:instant_health  minecraft:instant_damage
    #   minecraft:jump_boost      minecraft:nausea
    #   minecraft:regeneration    minecraft:blindness
    #   minecraft:night_vision    minecraft:hunger
    #   minecraft:fire_resistance minecraft:wither
    #   minecraft:water_breathing minecraft:health_boost
    #   minecraft:invisibility    minecraft:absorption
    #                             minecraft:saturation
    # 
    # Modded potions use their own modid, e.g. "mymod:my_potion"
    # 
    # Default: Strength V + Resistance V for 30 seconds each.
    S:effects <
        minecraft:strength,4,30
        minecraft:resistance,4,30
     >
}


